[package]
name         = "vulkane-slang-emit"
version      = "0.22.10"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "DEPRECATED: moved to fishstringer-slang-emit; this crate re-exports it. FishStringer owns Slang."
keywords     = ["slang", "shader", "deprecated"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ciresnave/vulkane"
homepage     = "https://github.com/ThinkersJournal/fishstringer"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*"]

[dependencies]
fishstringer-slang-emit = "0.0.17"

[features]
convert = ["fishstringer-slang-emit/convert"]

[lints.rust]
missing_docs = "deny"
