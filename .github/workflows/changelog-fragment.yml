# A pull request carries exactly one CHANGELOG fragment (changelog.d/README.md), or bumps the version itself.
name: Changelog fragment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fragment:
    name: One fragment per PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: One fragment, or a manual bump
        run: python3 tools/check-fragment.py "origin/${{ github.base_ref }}"
