name: CI

on:
  push:
    branches: [main]

  # NO `branches:` FILTER HERE, DELIBERATELY. With `branches: [main]` a pull
  # request based on any other branch got NO CI AT ALL -- not red, not pending,
  # ABSENT. A stacked PR was therefore indistinguishable from a PR with nothing
  # wrong, which is the one failure shape that leaves no artefact to misread.
  # Found by stacking a PR on another and noticing it had only third-party
  # checks attached.
  #
  # This DOES cost CI minutes -- stacked PRs now run a full matrix each, where
  # before they ran nothing. What it does not do is duplicate work for any one
  # PR. An earlier version of this comment said it "costs nothing extra", which
  # was wrong: the honest trade is minutes for the ability to tell a green
  # stacked PR from an untested one.
  #
  # NOT opting into `types: [.., edited]`, and the omission is deliberate.
  # Retargeting a PR's base fires `edited`, which is not in the default
  # opened/synchronize/reopened set, so a retarget alone still starts no run --
  # close and reopen the PR, or push. Opting in would fix that, but `edited`
  # also fires on every TITLE and BODY edit, and PR bodies here get revised
  # repeatedly. That trades a frequent waste for a rare inconvenience.
  #
  # `push` stays scoped to main on purpose. An open PR already gets a run on
  # every push via `synchronize`, so widening this one would double every run
  # rather than close a gap.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The GPU serialization guard (`common::require_serialization_lock`) refuses
  # to touch a device unless `gpu-run.ps1` holds the machine-wide `Global\gpu-run`
  # mutex. That mutex stops two runs sharing ONE developer machine's GPU; a CI
  # runner is ephemeral and single-tenant, so there is nothing to serialize
  # against and no wrapper to hold it. CI takes the escape hatch WITH A REASON,
  # which is the point of it being reason-bearing: `PROCEEDING UNGUARDED: <why>`
  # lands in the log of every job that touches a device, so the bypass stays
  # visible instead of becoming the silent default the guard exists to prevent.
  #
  # Declared at WORKFLOW level, not per step, and that placement is the fix for
  # a real failure rather than tidiness. Set on three steps by name, it missed
  # `Test (no default features)` — which also runs the device tests — and that
  # leg failed alone for a reason the other two did not share. A per-step
  # allowlist of "steps that can reach a device" is a list someone must keep
  # complete, and the cost of an omission is a confusing red rather than a loud
  # one.
  GPU_RUN_UNGUARDED: "CI runner: ephemeral and single-tenant, no shared GPU to serialize against"

# NOTE ON `dtolnay/rust-toolchain@stable` BELOW: it does not decide what this
# repo builds with. `rust-toolchain.toml` does. The action ends in `rustup
# default <toolchain>`, and a default is the LOWEST-precedence selector rustup
# has -- below the toolchain file, which is why the pin wins without the action
# being removed. It still earns its place: it bootstraps rustup on the runner
# and sets CARGO_INCREMENTAL/sparse-registry defaults. Read `@stable` as "get a
# working rustup", not as "build with stable".
#
# The MSRV jobs are the exception and deliberately so: they pass an explicit
# `+<version>`, which is the HIGHEST-precedence selector and beats the pin. That
# is required -- a pin that captured them would test 1.98 under four leg names
# saying 1.85 and 1.88. Their toolchain-confirmation step exists to catch that.
jobs:
  build:
    name: Build & test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A pin that is present but INERT looks exactly like a pin that works:
      # `stable` and the pinned version resolve to the same compiler today, so a
      # version echo on its own would confirm nothing about the MECHANISM. rustup
      # names the override SOURCE, and this asserts on that rather than printing
      # it -- a line nobody reads changes nothing if the pin stops applying.
      # Without the file the same command reports `(default)` instead.
      - name: Confirm the toolchain file is what selects the toolchain
        shell: bash
        run: |
          set -euo pipefail
          active="$(rustup show active-toolchain)"
          echo "$active"
          case "$active" in
            *rust-toolchain.toml*) ;;
            *) echo "error: expected the pin to select the toolchain, got: $active" >&2
               exit 1 ;;
          esac

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on Cargo.lock, not `**/Cargo.toml`. The glob is evaluated in
          # the *post* step too, by which point `target/` is fully populated,
          # and hashFiles has to walk the whole workspace to evaluate `**`.
          # On the Windows runner that traversal exceeds the action's hard
          # 120-second limit and fails the job — after every test has already
          # passed. Cargo.lock is a single file at the repository root, so
          # there is no tree to walk, and it is the better key regardless: it
          # pins exact resolved dependency versions, where a manifest only
          # gives version ranges.
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Install a software Vulkan implementation on Linux so the real-Vulkan
      # integration test (and any GPU examples) can actually run in CI.
      # Lavapipe is Mesa's Vulkan software rasterizer — it implements the
      # Vulkan 1.3 API in software and is good enough to validate that our
      # generated bindings work end-to-end against a real driver.
      - name: Install Lavapipe (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          # Verify the loader can find the ICD
          vulkaninfo --summary || true

      # vk.xml is downloaded automatically via the fetch-spec feature on CI
      # so we don't need to vendor a copy of the spec.
      - name: Build (default features)
        run: cargo build -p vulkane --features fetch-spec

      # Tested, not merely built. Building proves the cfg gates compile;
      # running proves the crate still behaves without `build-support`, which
      # is a default feature and therefore the configuration least likely to be
      # exercised by anyone locally. 82 tests pass here that a build alone
      # never executed.
      - name: Test (no default features)
        run: cargo test -p vulkane --features fetch-spec --no-default-features

      - name: Build with naga feature
        run: cargo build -p vulkane --features fetch-spec,naga

      - name: Run unit tests (no naga)
        # On Linux, Lavapipe is installed above so the real-Vulkan integration
        # test will actually exercise the loader against a software Vulkan
        # implementation. On Windows/macOS the test gracefully skips if no
        # driver is found.
        run: cargo test --workspace --features fetch-spec

      - name: Run unit tests (with naga)
        # Re-run with the naga feature on so the GLSL compilation tests
        # actually execute. They don't require a Vulkan driver.
        run: cargo test --workspace --features fetch-spec,naga

      # `derive` and `kiss-target` gate whole test files behind
      # `#![cfg(feature = "...")]`. Without them those files compile to
      # nothing and report `running 0 tests ... ok` — which is indistinguishable
      # from a real pass in the summary, so the gap was invisible. Until this
      # step existed, CI had never once executed `vertex_derive_test.rs` (the
      # regression test for signed-integer vertex attributes being given a
      # float format) or `kiss_target_live.rs`.
      #
      # Both are pure Rust and need no external toolchain, so there is no
      # reason for them not to run everywhere.
      #
      # `vertex_derive_test` is CPU-only and genuinely executes on every
      # platform — that is the real gain here, since it is the regression test
      # for signed-integer vertex attributes being handed a float format.
      #
      # `kiss_target_live` needs a Vulkan device. On Windows/macOS there is no
      # ICD, so its five tests skip: they report `ok` in ~0.02s against ~8s for
      # a real run, asserting nothing. That is acceptable there — those runners
      # genuinely have no device, and a permanently red job is a job people
      # stop reading.
      #
      # On Linux it is not acceptable, because Lavapipe is installed above and
      # `vulkaninfo` reports llvmpipe at 1.4. A skip there does not mean "no
      # hardware", it means the evidence this run exists to produce did not get
      # produced — while the job still reports success.
      #
      # So `VULKANE_REQUIRE_DEVICE` is set on Linux only, which turns a
      # device-gated skip into a failure (see `vulkane/tests/common/mod.rs`).
      # A green Linux job now means the token derivation was actually
      # exercised, rather than merely not attempted.
      #
      # If this step fails on Linux, read it as a finding, not a flake: it says
      # Lavapipe does not satisfy a precondition these tests assume. Fix the
      # environment or the precondition — do not unset the variable, which
      # would restore a green that means nothing.
      - name: Run unit tests (derive + kiss-target)
        env:
          VULKANE_REQUIRE_DEVICE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --features fetch-spec,derive,kiss-target

      # All eighteen, not a subset. An example that does not compile is a
      # broken artifact shipped inside the crate, and until `ci_coverage.rs`
      # existed, eleven of these were never built by anything — the repository
      # would not have noticed one rotting. `every_example_is_built_by_ci`
      # fails if a new one is added without a line here.
      - name: Build examples
        run: |
          cargo build -p vulkane --features fetch-spec --example allocator_compute
          cargo build -p vulkane --features fetch-spec --example buffer_upload
          cargo build -p vulkane --features fetch-spec --example compute_image_invert
          cargo build -p vulkane --features fetch-spec --example compute_square
          cargo build -p vulkane --features fetch-spec --example deferred_shading
          cargo build -p vulkane --features fetch-spec --example depth_prepass
          cargo build -p vulkane --features fetch-spec --example device_info
          cargo build -p vulkane --features fetch-spec --example external_memory_export
          cargo build -p vulkane --features fetch-spec --example fill_buffer
          cargo build -p vulkane --features fetch-spec --example headless_triangle
          cargo build -p vulkane --features fetch-spec --example instanced_mesh
          cargo build -p vulkane --features fetch-spec --example kiss_device_fixture
          cargo build -p vulkane --features fetch-spec --example raw_interop
          cargo build -p vulkane --features fetch-spec --example ray_tracing_as_build
          cargo build -p vulkane --features fetch-spec --example shadow_map
          cargo build -p vulkane --features fetch-spec --example textured_quad
          cargo build -p vulkane --features fetch-spec --example windowed_triangle
          cargo build -p vulkane --features fetch-spec,derive --example derive_vertex
          cargo build -p vulkane --features fetch-spec,naga --example compile_shader

      # The vocabulary manifest emitter lives in kiss-vulkan-vocab, which the
      # example list above does not cover (it is scoped to -p vulkane). Built
      # here so a change that breaks it is caught, and RUN so the threshold
      # search is exercised: it panics rather than emitting a weakened vector
      # set if it cannot land exactly on the boundary, which is a failure worth
      # surfacing in CI rather than at the next regeneration.
      # `shell: bash` is required, not cosmetic. The Windows runner defaults to
      # PowerShell, which reads `/dev/null` as a literal Windows path under
      # the D: drive and fails the step with "Could not find a part of the path".
      # The Lavapipe step below gets away with the same redirect only because it is
      # gated to Linux; this one runs on all three platforms.
      - name: Build and run the vocabulary manifest emitter
        shell: bash
        run: |
          cargo run -p kiss-vulkan-vocab --example emit_vocabulary_manifest > /dev/null

      - name: Run examples on Linux (with Lavapipe)
        if: runner.os == 'Linux'
        run: |
          cargo run -p vulkane --features fetch-spec --example device_info
          cargo run -p vulkane --features fetch-spec --example fill_buffer
          cargo run -p vulkane --features fetch-spec --example compute_square
          cargo run -p vulkane --features fetch-spec --example compute_image_invert
          cargo run -p vulkane --features fetch-spec --example headless_triangle
          # A third ICD profile for the fixture generator. Lavapipe reports no
          # cooperative support at all, so this is the leg that exercises the
          # "supports none, honestly" path end to end on a device that is not
          # the one the committed fixture was captured on. Output is discarded:
          # the committed fixture must come from real hardware, and CI proving
          # it can be *regenerated* here would be proving the wrong thing.
          cargo run -p vulkane --features fetch-spec --example kiss_device_fixture > /dev/null

  # `shaderc` and `slang` gate whole test files behind `#![cfg(feature = "…")]`,
  # and until these jobs existed neither feature was switched on anywhere in
  # CI — so `shaderc_test.rs` (4 tests) and `slang_test.rs` (5 tests) compiled
  # to nothing and reported `running 0 tests ... ok`, exactly the silent-absence
  # failure described in `vulkane/tests/ci_coverage.rs`.
  #
  # They are separate jobs rather than steps in `build` for two reasons: both
  # need a native toolchain the main matrix has no other use for, and keeping
  # them apart means a toolchain problem in one is attributable instead of
  # taking an otherwise-healthy platform leg down with it.
  shaderc:
    name: shaderc (GLSL/HLSL -> SPIR-V)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-shaderc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-shaderc-
      # Deliberately does NOT install `libshaderc-dev`.
      #
      # `shaderc-sys` prefers a system library and only builds from source when
      # it finds none. Ubuntu's `libshaderc-dev` is found and then fails to
      # link: it resolves the shaderc symbols but not the SPIRV-Tools ones it
      # depends on, so the build dies on a wall of
      # `undefined symbol: spvtools::Optimizer::...`. An incomplete system
      # library is worse than no system library, because it wins the search and
      # suppresses the fallback that would have worked.
      #
      # Building from source takes minutes rather than seconds. That is the
      # cost of this job being deterministic instead of dependent on how a
      # distribution happens to split its packages this year.
      - name: Install shaderc build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git g++
      - name: Build and test with shaderc
        run: cargo test -p vulkane --features fetch-spec,shaderc --test shaderc_test

  slang:
    name: slang (Slang -> SPIR-V)
    # Pinned, not `ubuntu-latest`. This job needs a LunarG apt repository named
    # for a specific Ubuntu release, and `ubuntu-latest` is a moving target —
    # when GitHub repoints it, a hardcoded release name silently starts
    # installing packages built for a different one. Pinning makes the runner
    # and the repository name one decision instead of two that can drift apart;
    # the codename is derived from the runner below rather than written twice,
    # so bumping this line is the only edit needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-slang-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-slang-
      # `shader-slang-sys` needs two separate things, and its build script
      # fails differently for each: the Slang library itself (found via
      # SLANG_DIR / VULKAN_SDK) and libclang, because it runs bindgen. Missing
      # libclang produces "Unable to find libclang", which reads like a Slang
      # problem and is not — verified locally against a Vulkan SDK that had
      # Slang present and still failed on the bindgen step.
      - name: Install Slang toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang
          # Codename from the runner itself, so the repository always matches
          # the image actually in use rather than one written here months ago.
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-${CODENAME}.list" \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${CODENAME}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          # Discovered rather than hardcoded to an LLVM version directory. A
          # wrong path here fails as "Unable to find libclang", which reads like
          # a Slang problem and is not — so it is found, checked, and exported
          # rather than assumed.
          LIBCLANG_DIR="$(dirname "$(find /usr/lib -name 'libclang.so*' -print -quit)")"
          test -d "$LIBCLANG_DIR" || { echo "libclang not found after install"; exit 1; }
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"
      - name: Build and test with slang
        run: cargo test -p vulkane --features fetch-spec,slang --test slang_test

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Build the documentation with all features enabled and treat any
      # broken intra-doc link as an error. This is what docs.rs will do
      # when the crate is published.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --features fetch-spec --no-deps

  # Not a gate on the code — a gate on the LOCAL gate harness.
  # `.github/local_gates.py` extracts these very `run:` steps so a developer's
  # local check set cannot silently omit a job. Its first self-test asserts every
  # command here has a policy, so ADDING A CI JOB WITHOUT DECIDING ABOUT IT FAILS
  # HERE rather than months later when someone's green local run meets a red CI.
  local-gates:
    name: Local gate harness self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Provisioning is a SEPARATE step from the gate, deliberately. The harness
      # replays these commands locally, and a gate bundled with a `pip install`
      # makes a local verification depend on the network. Same category as the
      # apt-get steps above, and skipped locally for the same reason.
      - name: Install pyyaml (runner provisioning)
        shell: bash
        run: python3 -m pip install --quiet pyyaml

      - name: Self-test the local gate harness
        shell: bash
        run: python3 .github/local_gates.py --self-test

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --features fetch-spec -- -D warnings

  # A declared `rust-version` is a promise to consumers, and until this job
  # existed vulkane's had never been run. It was wrong: the manifests said 1.85,
  # but `vulkan_gen` uses let-chains (stable in 1.88) and `libloading 0.9`
  # declares 1.88.0 itself, so no consumer on 1.85 could ever have compiled the
  # crate. Two of the three other floors measured across the portfolio that day
  # were also false. An unexercised floor is not a conservative estimate; it is
  # an untested claim that happens to be printed on the box.
  msrv-discover:
    name: MSRV (read declared floors)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: read
        name: Read each crate's declared rust-version
        shell: bash
        # `set -e` matters here: without it a failing script yields an empty
        # `$(...)`, the echo still succeeds, and the matrix below expands to
        # nothing -- a job that tests zero crates and reports green.
        run: |
          set -euo pipefail
          matrix="$(python3 .github/msrv_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  msrv:
    name: MSRV ${{ matrix.crate.msrv }} - ${{ matrix.crate.name }}
    needs: msrv-discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.msrv-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      # Install and invoke MUST use the same string. rustup does not treat
      # `1.85` as an alias for `1.85.0` -- they are separate toolchains, and a
      # bare `1.85` installs the latest patch of that minor (1.85.1 today).
      # Normalising one side and not the other yields "toolchain not installed"
      # at best, and at worst a build against a compiler nobody declared.
      - name: Install the declared toolchain
        shell: bash
        run: rustup toolchain install "${{ matrix.crate.msrv }}" --profile minimal
      # If `+1.85` ever silently resolved to something else, every build below
      # would pass while testing a compiler nobody promised. Assert the
      # toolchain that answers is the one the manifest named.
      - name: Confirm the toolchain that answers is the one asked for
        shell: bash
        run: |
          set -euo pipefail
          want="${{ matrix.crate.msrv }}"
          got="$(cargo "+$want" --version | awk '{print $2}')"
          case "$got" in
            "$want"|"$want".*) echo "cargo $got answers to +$want" ;;
            *) echo "error: asked for +$want but cargo reports $got"; exit 1 ;;
          esac
      # BUILD, not test. A consumer compiles this crate; they do not run its dev
      # tests. Gating on dev-dependencies would eventually force the floor up
      # for reasons that have nothing to do with the promise being made.
      - name: Build at the declared floor
        shell: bash
        run: cargo "+${{ matrix.crate.msrv }}" build -p "${{ matrix.crate.name }}" --locked
