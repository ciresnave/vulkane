name: loader-repro
on:
  push:
    branches: [loader-repro]
jobs:
  repro:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - name: Build the race binary
        run: |
          cargo test -p vulkane --test race_repro --no-run
          ls -t target/debug/deps/race_repro-* | grep -v '\.d$' | head -1 > bins.txt
          cat bins.txt
      - name: Crash rate by variant
        env:
          VULKANE_REQUIRE_DEVICE: '1'
          GPU_RUN_UNGUARDED: 'CI diagnostic: ephemeral single-tenant runner'
        run: |
          set +e
          bin=$(tail -1 bins.txt)
          for v in "plain 8" "plain 1" "lock_new 8" "lock_all 8" "plain 2" "plain 4"; do
            set -- $v
            crashes=0; other=0
            for i in $(seq 1 40); do
              RACE_MODE=$1 RACE_THREADS=$2 "$bin" > /dev/null 2>&1; rc=$?
              if [ $rc -eq 139 ]; then crashes=$((crashes+1)); elif [ $rc -ne 0 ]; then other=$((other+1)); fi
            done
            echo "RVARIANT mode=$1 threads=$2 runs=40 segv=$crashes other_fail=$other"
          done
