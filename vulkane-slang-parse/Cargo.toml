[package]
name         = "vulkane-slang-parse"
version      = "0.19.5"
edition      = "2024"
# 1.90: `tree-sitter-language` 0.1.9 (the grammar ABI shim under tree-sitter-slang) declares it;
# the highest `rust-version` in this crate's normal+build dependency tree (measured 2026-10-31).
rust-version = "1.90"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "The Slang front end for Unpopped: a tree-sitter Slang parser, the Slang residue list and the `SLANG` Frontend that lifts Slang compute kernels into Unpopped's IR. Vulkane owns Slang."
keywords     = ["kernel", "parser", "compiler", "slang", "shader"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ciresnave/vulkane"
homepage     = "https://github.com/ciresnave/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*", "THIRD-PARTY-NOTICES.md"]

[dependencies]
# `Frontend`, the `lift_*` walkers and `LiftError` live in unpopped's `convert` module.
unpopped          = { version = "0.38.0", features = ["convert"] }
# MUST be the same tree-sitter minor that `unpopped` uses: `Frontend::parse` returns a
# `tree_sitter::Tree`, and cargo allows one `links = "tree-sitter"` package per build.
# `unpopped` 0.35 moved to 0.27 (the latest); with 0.34.x this crate had to stay on 0.26 (measured
# 2026-10-30: 0.27 next to `unpopped` 0.34.11 fails with "links to the native library `tree-sitter`").
# REVISIT TRIGGER: every `unpopped` release that moves tree-sitter; bump this the same day (D5).
tree-sitter       = "0.27"
tree-sitter-slang = "0.3"

[dev-dependencies]
unpopped-vocab = "0.38.0"

[lints.rust]
missing_docs                  = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all                = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity    = "allow"
