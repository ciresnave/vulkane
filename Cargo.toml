[workspace]
  members = [
    "vulkane",
    "vulkane_derive",
    "vulkan_gen",
    "kiss-vulkan-vocab",
    "vulkane-kernels-source",
    "vulkane-slang-emit",
    "vulkane-slang-parse",
  ]
  resolver = "2"

  [workspace.dependencies]
    libloading = "0.9"
    regex      = "1.12"
    serde      = { version = "1.0", features = ["derive"] }
    serde_json = "1.0"
    tempfile   = "3.27"
    thiserror  = "2.0"
