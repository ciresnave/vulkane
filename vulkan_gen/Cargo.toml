[package]
name = "vulkan_gen"
version = "0.5.0"
edition = "2024"
# 1.88 for let-chains. Checked, not asserted: the msrv-minimality job
# requires this crate to FAIL to compile on 1.87, so a floor that stops
# being necessary goes red instead of quietly excluding consumers.
rust-version = "1.88"
authors = ["Eric Evans <ciresnave@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Vulkan XML specification parser and Rust binding generator. Used internally by the vulkane crate, but reusable as a standalone code generator."
keywords = ["vulkan", "codegen", "bindings", "xml", "ffi"]
categories = ["development-tools", "parser-implementations", "graphics"]
repository = "https://github.com/ciresnave/vulkane"
homepage = "https://github.com/ciresnave/vulkane"
documentation = "https://docs.rs/vulkan_gen"
readme = "README.md"

[dependencies]
roxmltree = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
