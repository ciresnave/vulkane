[package]
name         = "vulkane-wgsl-parse"
version      = "0.21.9"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "A WGSL front end: parses WGSL into an owned Rust AST and reflects entry points and resource bindings. Vulkane owns WGSL."
keywords     = ["wgsl", "parser", "shader", "webgpu"]
categories   = ["parser-implementations", "graphics"]
repository   = "https://github.com/ciresnave/vulkane"
homepage     = "https://github.com/ciresnave/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*"]

[dependencies]
wgsl-parse = "0.6.0"

[dev-dependencies]
naga = { version = "30.0", features = ["wgsl-in"] }
