# cargo-deny configuration (template: FishStringer's deny.toml). An advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # cargo-deny has no expiry field, so the date lives in the reason and in ROADMAP row 10; nothing enforces it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable; dev-only via winit 0.30.13 -> sctk-adwaita -> ab_glyph -> owned_ttf_parser, never shipped; PM ruling 2026-11-17, expires 2026-12-18, remove when winit moves off it" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots (the root-certificate data behind ureq, build-time `fetch-spec` only): a permissive data licence.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own dev-dependencies are path-only (`vulkane = { path = "../vulkane" }`); they are never published as such.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
