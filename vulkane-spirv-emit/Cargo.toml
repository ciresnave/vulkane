[package]
name         = "vulkane-spirv-emit"
version      = "0.21.4"
edition      = "2024"
rust-version = "1.85"
authors      = ["Eric Evans <CireSnave@gmail.com>"]
license      = "MIT OR Apache-2.0"
description  = "The SPIR-V compute-shader emitter for Unpopped: IR to a binary SPIR-V module (GLSL.std.450, storage-buffer blocks, a LocalSize entry), carried as the kernel's word stream. Vulkane owns SPIR-V."
keywords     = ["spirv", "vulkan", "codegen", "compiler", "shader"]
categories   = ["compilers", "development-tools", "graphics"]
repository   = "https://github.com/ciresnave/vulkane"
homepage     = "https://github.com/ciresnave/vulkane"
readme       = "README.md"
include      = ["src/**", "README.md", "LICENSE-*", "THIRD-PARTY-NOTICES.md"]

[dependencies]
rspirv         = "0.13.0"
unpopped       = "0.43.2"
unpopped-vocab = "0.43.2"

[dev-dependencies]
# Reflection of the emitted module: entry point, workgroup size, bindings.
vulkane-spirv-parse = { path = "../vulkane-spirv-parse" }
# The live-device shift test opens a device through the safe wrapper (and its shared `tests/common`).
vulkane            = { path = "../vulkane" }
# G4.2: the host reference the device results are compared with.
unpopped-cpu-c     = "0.43.2"
# Cross-check: the Slang emitter, compiled by `slangc`, against this one on the same device.
vulkane-slang-emit = { path = "../vulkane-slang-emit" }
tempfile           = { workspace = true }

[lints.rust]
missing_docs                  = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"

[lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all                = { level = "warn", priority = -1 }
too_many_arguments = "allow"
